# ============================================================
#  回忆录子站点  memoir.example.com
#  放到 ECS 的 /etc/nginx/conf.d/memoir.conf
#  前置：阿里云云解析里加一条 A 记录
#        memoir.example.com  ->  YOUR_SERVER_IP
#  说明：本文件只配 80；跑完 certbot --nginx 会自动补 443+跳转
# ============================================================

server {
    listen 80;
    # nginx 的 server_name 必须是 ASCII（punycode）。
    # 浏览器输入 memoir.example.com 时会自动转成下面这串 Host 头
    server_name memoir.example.com;

    # 大文件上传/语音/图片生成较慢，放宽超时
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}


